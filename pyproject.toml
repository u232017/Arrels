[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arrels"
version = "0.2.0"
description = "Arrels MVP — pipeline de datos de Barri Lab (Telefónica Mobile Data Challenge 2026)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Barri Lab" }]
dependencies = [
  "duckdb==1.1.3",
  "pyarrow==26.0.1",
  "python-dotenv==1.2.4",
  "pandas==3.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.4"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
pipeline = ["reference/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pipeline"]
omit = ["pipeline/run.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
